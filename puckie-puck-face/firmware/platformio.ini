; PlatformIO project for Puckie Puck Face, the Xiegu X6200 wireless knob,
; running on the ELECROW CrowPanel 2.1" HMI Rotary Display (ESP32-S3-N16R8).
;
; Why PlatformIO instead of the Arduino IDE: every library and the ESP32
; core itself are version-pinned in this one file, so the build that works
; today still works in two years. The Elecrow vendor examples require
; Arduino-ESP32 core 2.0.14; platform-espressif32 6.5.0 is the PlatformIO
; release that ships exactly that core.
;
; Library versions are pinned to the exact versions Elecrow bundles in
; their vendor repo (CrowPanel-2.1inch-HMI GitHub repo, example/libraries
; folder), because the Arduino_GFX API changed after 1.3.x and the display
; init code below is written against the 1.3.1 API.

[env:crowpanel21]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino

; The CrowPanel is an ESP32-S3-N16R8: 16 MB quad-SPI flash plus 8 MB
; octal-SPI PSRAM. "qio_opi" tells the core to run flash in QIO mode and
; PSRAM in octal mode. Without PSRAM enabled, the two full-screen LVGL
; draw buffers (480x480x2 bytes each, about 461 KB apiece) cannot exist.
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

monitor_speed = 115200

build_flags =
    -DBOARD_HAS_PSRAM
    ; LVGL finds our lv_conf.h on the include path instead of expecting it
    ; next to the library itself.
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    ; Silence a flood of deprecation warnings from the pinned older libs.
    -Wno-deprecated-declarations

lib_deps =
    ; Display driver. 1.3.1 is what Elecrow builds their example against;
    ; newer 1.4.x renamed the Arduino_ESP32RGBPanel constructor arguments.
    https://github.com/moononournation/Arduino_GFX.git#v1.3.1
    ; UI toolkit, LVGL 8 API (v9 is a breaking change, do not bump blindly).
    lvgl/lvgl@8.3.6
    ; I/O expander that holds the LCD reset, touch reset and encoder button.
    xreef/PCF8574 library@2.3.7
    ; Capacitive touch controller driver (CST816 family).
    adafruit/Adafruit CST8XX Library@1.1.1
    adafruit/Adafruit BusIO@^1.14.5
    ; JSON parsing for the POTA spots feed.
    bblanchon/ArduinoJson@^6.21.5
